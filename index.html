
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>RetroTee 復古潮T</title>
  
<style>
  :root {
    --bg: #1b1b2f;
    --bg-dark: #121212;
    --accent: #00f5d4;
    --accent-hover: #00cdb2;
    --text: #f5f5f5;
    --subtext: #ccc;
    --card: #222;
  }
  body.light-mode {
    --bg: #fefefe;
    --bg-dark: #ffffff;
    --accent: #3a0ca3;
    --accent-hover: #4361ee;
    --text: #111;
    --subtext: #333;
    --card: #f0f0f0;
  }
  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    transition: all 0.3s ease;
  }
  header {
    background: var(--bg-dark);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent);
  }
  header h1 {
    font-size: 1.8rem;
    color: var(--accent);
  }
  nav a {
    margin-right: 1rem;
    color: var(--text);
    text-decoration: none;
  }
  body.dark-mode {
      background-color: #333;
      color: #f4f4f4;
    }

    .mode-toggle {
      padding: 10px 20px;
      background-color: #ff6347;
      color: white;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      position: fixed;
      top: 10px;
      right: 10px;
    }
    .mode-toggle:hover {
      background-color: #e53e34;
    }
  main {
    max-width: 1000px;
    margin: auto;
    padding: 2rem;
  }
  footer {
    text-align: center;
    padding: 1rem;
    background: var(--bg-dark);
    color: var(--subtext);
    margin-top: 3rem;
  }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
  }
  .product {
    background: var(--card);
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
  }
  .product img {
    max-width: 100%;
    border-radius: 6px;
  }
  .product h3 {
    color: var(--accent);
    margin-top: 0.5rem;
  }
</style>

</head>
<body>
  
<header>
  <h1>RetroTee 復古潮T</h1>
  <nav>
    <a href="index.html">首頁</a>
    <a href="products.html">商品</a>
    <a href="about.html">關於我們</a>
    <a href="cart.html">購物車</a>
    <button class="mode-toggle" onclick="toggleMode()">切換模式</button>
  </nav>
</header>

  <main>
    <h2>潮流重返 90 年代</h2>
    <p>歡迎來到 RetroTee，我們精選來自 80s~90s 的經典復古 T 恤，打造你專屬的風格！</p>
    <img src="https://images.unsplash.com/photo-1602810318383-29b5e521408d?w=800&q=80" style="width:100%;margin-top:2rem;border-radius:8px;" alt="復古潮T展示圖">
  </main>
  
<footer>
  &copy; 2025 RetroTee 復古潮T | 設計與靈魂並存。
</footer>
<script>
      // 檢查 localStorage 是否有儲存模式設定
    const currentMode = localStorage.getItem('mode');

    // 如果有儲存的模式設定，應用該模式
    if (currentMode === 'dark') {
      document.body.classList.add('dark-mode');
    }

    // 切換模式
    function toggleMode() {
      document.body.classList.toggle('dark-mode');
      const mode = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
      
      // 儲存當前模式設定到 localStorage
      localStorage.setItem('mode', mode);
    }
</script>

</body>
</html>
