<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>購物車 - RetroTee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>購物車</h1>
  <nav>
    <a href="index.html">首頁</a>
    <a href="products.html">商品</a>
    <a href="about.html">關於我們</a>
    <a href="cart.html">購物車</a>
    <button class="toggle-mode" onclick="toggleMode()">切換模式</button>
  </nav>
</header>
<main>
  <h2>您的購物車</h2>
  <ul id="cart-list"></ul>
  <p id="total"></p>
  <a href="checkout.html"><button>前往結帳</button></a>
</main>
<footer>&copy; 2025 RetroTee 復古潮T</footer>
<script src="mode.js"></script>
<script>
const cart = JSON.parse(localStorage.getItem("cart")) || [];
const list = document.getElementById("cart-list");
let total = 0;
cart.forEach(item => {
  const li = document.createElement("li");
  li.textContent = `${item.name} x ${item.qty} - $${item.price * item.qty}`;
  list.appendChild(li);
  total += item.price * item.qty;
});
document.getElementById("total").textContent = "總計: $" + total;
</script>
</body>
</html>
