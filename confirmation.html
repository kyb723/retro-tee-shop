<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>確認訂單 - RetroTee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>訂單完成</h1>
  <nav>
    <a href="index.html">首頁</a>
    <a href="products.html">商品</a>
    <a href="about.html">關於我們</a>
    <a href="cart.html">購物車</a>
    <button class="toggle-mode" onclick="toggleMode()">切換模式</button>
  </nav>
</header>
<main>
 <h1>訂單確認</h1>
  <div class="confirmation-message">
    <p>感謝您的訂購！您的訂單已成功提交。</p>
    <p>您將會在 3-5 個工作日內收到商品。謝謝！</p>
  </div>
  <a href="index.html">返回首頁</a>
</main>
<footer>&copy; 2025 RetroTee 復古潮T</footer>
<script src="mode.js"></script>
<script>
  localStorage.removeItem("cart");
  
      // 初始載入時，根據 localStorage 設定模式
  window.addEventListener('DOMContentLoaded', () => {
    const savedMode = localStorage.getItem('mode');
    if (savedMode === 'light') {
      document.body.classList.add('light-mode');
    }
  });

  function toggleMode() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('mode', isLight ? 'light' : 'dark');
  }
</script>
</body>
</html>
