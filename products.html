<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>商品 - RetroTee 復古潮T</title>
  <style>
    /* 保持原有樣式，新增購物車樣式 */
    .product {
      background: #222;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
    }
    .cart {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #ff6347;
      color: #fff;
      padding: 10px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>RetroTee 商品</h1>
    <nav>
      <a href="index.html">首頁</a>
      <a href="about.html">關於我們</a>
      <a href="cart.html">購物車</a>
      <span id="cart-count" class="cart">0</span> <!-- 顯示購物車數量 -->
    </nav>
  </header>
  <main>
    <h2>商品一覽</h2>
    <div class="product-grid">
      <!-- 商品卡片範例 -->
      <div class="product">
        <img src="images/image_2.jpg" alt="復古黑膠 T 恤">
        <h3>復古黑膠 T 恤</h3>
        <p>靈感來自黑膠封面，簡約又有型</p>
        <button onclick="addToCart('復古黑膠 T 恤', 1)">加入購物車</button>
      </div>
      <div class="product">
        <img src="images/image_3.jpg" alt="懷舊遊戲 T">
        <h3>懷舊遊戲 T</h3>
        <p>懷舊任天堂風格，像素圖案滿滿回憶</p>
        <button onclick="addToCart('懷舊遊戲 T', 1)">加入購物車</button>
      </div>
      <div class="product">
        <img src="images/image_4.jpg" alt="霓虹都市 T">
        <h3>霓虹都市 T</h3>
        <p>夜景霓虹風，賽博龐克迷不可錯過</p>
        <button onclick="addToCart('霓虹都市 T', 1)">加入購物車</button>
      </div>
    </div>
  </main>
  <footer>
    &copy; 2025 RetroTee 復古潮T | 設計與靈魂並存。
  </footer>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // 顯示購物車數量
    function updateCartCount() {
      document.getElementById('cart-count').textContent = cart.length;
    }

    // 加入購物車
    function addToCart(productName, quantity) {
      let item = cart.find(item => item.name === productName);
      if (item) {
        item.quantity += quantity;
      } else {
        cart.push({ name: productName, quantity: quantity });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
    }

    updateCartCount(); // 初次載入時更新購物車數量
  </script>
</body>
</html>
