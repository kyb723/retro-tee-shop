
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>關於我們 - RetroTee 復古潮T</title>
  
<style>
  :root {
    --bg: #1b1b2f;
    --bg-dark: #121212;
    --accent: #00f5d4;
    --accent-hover: #00cdb2;
    --text: #f5f5f5;
    --subtext: #ccc;
    --card: #222;
  }
  body.light-mode {
    --bg: #fefefe;
    --bg-dark: #ffffff;
    --accent: #3a0ca3;
    --accent-hover: #4361ee;
    --text: #111;
    --subtext: #333;
    --card: #f0f0f0;
  }
  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    transition: all 0.3s ease;
  }
  header {
    background: var(--bg-dark);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent);
  }
  header h1 {
    font-size: 1.8rem;
    color: var(--accent);
  }
  nav a {
    margin-right: 1rem;
    color: var(--text);
    text-decoration: none;
  }
  .toggle-mode {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 0.4rem 0.8rem;
    border-radius: 5px;
    cursor: pointer;
  }
  main {
    max-width: 1000px;
    margin: auto;
    padding: 2rem;
  }
  footer {
    text-align: center;
    padding: 1rem;
    background: var(--bg-dark);
    color: var(--subtext);
    margin-top: 3rem;
  }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
  }
  .product {
    background: var(--card);
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
  }
  .product img {
    max-width: 100%;
    border-radius: 6px;
  }
  .product h3 {
    color: var(--accent);
    margin-top: 0.5rem;
  }
</style>

</head>
<body>
  
<header>
  <h1>RetroTee 復古潮T</h1>
  <nav>
    <a href="index.html">首頁</a>
    <a href="products.html">商品</a>
    <a href="about.html">關於我們</a>
    <a href="cart.html">購物車</a>
    <button class="toggle-mode" onclick="toggleMode()">切換模式</button>
  </nav>
</header>

  <main>
    <h2>關於 RetroTee</h2>
    <p>RetroTee 成立於 2025 年，由一群熱愛復古與街頭潮流的設計師組成，致力於復刻經典 T 恤文化，讓每一件衣服都有故事。</p>
    <p>我們從台灣出發，將復古風格融入現代設計，打造不只時尚、也具收藏價值的作品。</p>
  </main>
  
<footer>
  &copy; 2025 RetroTee 復古潮T | 設計與靈魂並存。
</footer>
<script>
  // 初始載入時，根據 localStorage 設定模式
  window.addEventListener('DOMContentLoaded', () => {
    const savedMode = localStorage.getItem('mode');
    if (savedMode === 'light') {
      document.body.classList.add('light-mode');
    }
  });

  function toggleMode() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('mode', isLight ? 'light' : 'dark');
  }
</script>

</body>
</html>
